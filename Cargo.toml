[package]
name = "kudu"
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Easily manage VMs on Linux"
readme = "README.md"
homepage = "https://github.com/pythops/kudu"
repository = "https://github.com/pythops/kudu"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
] }
tui-input = { version = "0.15" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["now"] }
strum = { version = "0.28", features = ["derive"] }
uuid = { version = "1", default-features = false, features = ["v4", "serde"] }
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
] }
qapi = { version = "0.15", features = ["qmp"] }
which = "8"
kvm-ioctls = "0.25"
rustix = { version = "1", features = ["fs"] }
rand = "0.10"
regex = "1.13"

[profile.release]
lto = "fat"
strip = true
codegen-units = 1
